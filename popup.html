<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Quizlet to Scholarsome</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      font-size: 14px;
      margin: 0;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 16px 0;
      color: #333;
    }

    .status {
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 12px;
      display: none;
    }

    .status.info {
      background-color: #e3f2fd;
      color: #1565c0;
      display: block;
    }

    .status.success {
      background-color: #e8f5e9;
      color: #2e7d32;
      display: block;
    }

    .status.error {
      background-color: #ffebee;
      color: #c62828;
      display: block;
    }

    .button {
      width: 100%;
      padding: 12px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .button:hover {
      background-color: #3367d6;
    }

    .button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .settings-link {
      display: block;
      text-align: center;
      margin-top: 12px;
      color: #4285f4;
      text-decoration: none;
      font-size: 13px;
    }

    .settings-link:hover {
      text-decoration: underline;
    }

    .card-count {
      font-size: 13px;
      color: #666;
      margin-bottom: 12px;
    }

    .loader {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #4285f4;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
      margin: 12px auto;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loader.active {
      display: block;
    }
  </style>
</head>
<body>
  <h1>Quizlet to Scholarsome</h1>
  
  <div id="status" class="status"></div>
  <div id="cardCount" class="card-count"></div>
  <div id="loader" class="loader"></div>
  
  <button id="importBtn" class="button">Import to Scholarsome</button>
  
  <a href="options.html" class="settings-link" target="_blank">Settings</a>

  <script src="popup.js"></script>
</body>
</html>
